<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Iso World Skeleton</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0f13;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        font-family: system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }

      #info {
        font-size: 14px;
        line-height: 1.35;
        white-space: pre-line;
      }

      #stats {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      #energy-bar {
        width: 160px;
        height: 12px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #171d29;
        overflow: hidden;
      }

      #energy-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #7ed957, #4a8f3c);
        transition: width 0.2s;
      }

      .hud-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        pointer-events: auto;
      }

      .hud-buttons button {
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #4a5568;
        background: #171d29;
        color: #fff;
        font-size: 15px;
        touch-action: manipulation;
      }

      .hud-buttons button.active {
        outline: 2px solid #8ab6ff;
        background: #22304a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
      <div id="info">Загрузка...</div>
      <div id="stats">
        <span id="stat-day">День 1, 06:00</span>
        <div id="energy-bar"><div id="energy-fill"></div></div>
      </div>
      <div class="hud-buttons">
        <button id="btn-build">Строительство: OFF</button>
        <button id="btn-remove">Снос: OFF</button>
        <button id="btn-craft">Крафт: 2 дерева → 1 камень</button>
        <button id="btn-wood">Дерево</button>
        <button id="btn-stone">Камень</button>
        <button id="btn-bag">Сумка [I]</button>
        <button id="btn-zoom-out">−</button>
        <button id="btn-zoom-in">+</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
