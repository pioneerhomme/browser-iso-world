<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Iso World Skeleton</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0f13;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        font-family: system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }

      #info {
        font-size: 14px;
        line-height: 1.35;
        white-space: pre-line;
      }

      #stats {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      #energy-bar {
        width: 160px;
        height: 12px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #171d29;
        overflow: hidden;
      }

      #energy-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #7ed957, #4a8f3c);
        transition: width 0.2s;
      }

      #hotbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      .hud-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        pointer-events: auto;
      }

      .hud-buttons button,
      #hotbar button {
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid #4a5568;
        background: #171d29;
        color: #fff;
        font-size: 15px;
        touch-action: manipulation;
      }

      .hud-buttons button.active,
      #hotbar button.active {
        outline: 2px solid #8ab6ff;
        background: #22304a;
      }

      /* ── панель инвентаря (DOM, не зависит от зума) ── */
      #inv-panel {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(430px, 94vw);
        max-height: 82vh;
        overflow-y: auto;
        background: rgba(16, 20, 28, 0.97);
        border: 2px solid #3a4a6a;
        border-radius: 12px;
        padding: 16px;
        z-index: 20;
        font-family: system-ui, sans-serif;
        color: #fff;
      }

      #inv-panel.hidden {
        display: none;
      }

      #inv-panel h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      #inv-resources,
      #inv-tools {
        font-size: 15px;
        color: #cfd6e6;
        margin-bottom: 6px;
      }

      .recipe-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid #22304a;
      }

      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(3, 16px);
        grid-template-rows: repeat(3, 16px);
        gap: 2px;
        flex: 0 0 auto;
      }

      .recipe-cell {
        background: #1a2233;
        border: 1px solid #3a4a6a;
        border-radius: 3px;
      }

      .recipe-cell.cw {
        background: #8a5a33;
      }

      .recipe-cell.cs {
        background: #9aa2ad;
      }

      .recipe-info {
        flex: 1 1 auto;
      }

      .recipe-info .muted {
        font-size: 12px;
        color: #9fb0cc;
      }

      .recipe-row button {
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #2f5c34;
        background: #1d2a1d;
        color: #9ff09a;
        font-size: 14px;
      }

      .panel-hint {
        margin-top: 10px;
        font-size: 12px;
        color: #9fb0cc;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="inv-panel" class="hidden">
      <h2>Инвентарь и крафт</h2>
      <div id="inv-resources"></div>
      <div id="inv-tools"></div>
      <div id="inv-recipes"></div>
      <div class="panel-hint">I или клик вне окна — закрыть | ЛКМ — ломать/рубить | ПКМ — поставить</div>
    </div>

    <div id="hud">
      <div id="info">Загрузка...</div>
      <div id="stats">
        <span id="stat-day">День 1, 06:00</span>
        <div id="energy-bar"><div id="energy-fill"></div></div>
      </div>
      <div id="hotbar"></div>
      <div class="hud-buttons">
        <button id="btn-place">Ставить: OFF</button>
        <button id="btn-bag">Сумка/Крафт [I]</button>
        <button id="btn-zoom-out">−</button>
        <button id="btn-zoom-in">+</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
